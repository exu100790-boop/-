<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乖寶寶章互動集點卡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <!-- 動態庫洛米互動區 -->
      <div class="mascot-box" id="mascotBox" title="點我跟庫洛米互動！">
        <div class="speech-bubble" id="speechBubble">今天也要當乖寶寶喔！</div>
        <div class="mascot-frame" id="mascotFrame">
  <svg id="svgKuromi" viewBox="0 0 180 155" style="width:175px; height:145px; overflow:visible;">
    <!-- 小斗篷 -->
    <path d="M44 108 Q90 98 136 108 L146 142 Q90 134 34 142 Z" fill="#3b1d4a" />
    <path d="M56 108 L90 122 L124 108 L116 126 L90 120 L64 126 Z" fill="#ff7eb6" />

    <!-- 小惡魔角（左／右） -->
    <g class="ear-left">
      <path d="M54 58 Q28 24 38 10 Q58 18 68 48 Z" fill="#231f26" />
      <path d="M42 16 L36 6 L48 12 Z" fill="#ff7eb6" />
    </g>
    <g class="ear-right">
      <path d="M126 58 Q152 24 142 10 Q122 18 112 48 Z" fill="#231f26" />
      <path d="M138 16 L144 6 L132 12 Z" fill="#ff7eb6" />
    </g>

    <!-- 頭部與臉蛋 -->
    <ellipse cx="90" cy="76" rx="46" ry="38" fill="#231f26" />
    <ellipse cx="90" cy="82" rx="34" ry="26" fill="#fff9fb" />

    <!-- 頭頂小骷髏徽章 -->
    <circle cx="90" cy="48" r="8" fill="#ff7eb6" />
    <circle cx="87.5" cy="47.5" r="1.4" fill="#231f26" />
    <circle cx="92.5" cy="47.5" r="1.4" fill="#231f26" />

    <!-- 傲嬌眼神、腮紅與嘴巴 -->
    <ellipse class="eye" cx="76" cy="80" rx="4.2" ry="5.8" fill="#231f26" />
    <ellipse class="eye" cx="104" cy="80" rx="4.2" ry="5.8" fill="#231f26" />
    <circle cx="75" cy="78" r="1.5" fill="#ffffff" />
    <circle cx="103" cy="78" r="1.5" fill="#ffffff" />
    <ellipse cx="65" cy="87" rx="5" ry="3" fill="#ffb3d1" opacity="0.85" />
    <ellipse cx="115" cy="87" rx="5" ry="3" fill="#ffb3d1" opacity="0.85" />
    <path d="M82 93 Q86 89 90 93 Q94 97 98 93" stroke="#231f26" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </svg>
</div>
        </div>
      </div>

      <div class="top-bar">
        <h1>乖寶寶集點卡</h1>
        <div class="badge-group">
          <span id="syncStatus" class="sync-pill">準備中...</span>
          <span class="badge">持有章數：<strong id="count">0</strong> 顆</span>
        </div>
      </div>
      <p class="subtitle" id="milestoneText">本輪集點進度：0 / 10</p>

      <!-- 10 個庫洛米印章格子 -->
      <div id="grid" class="grid"></div>

      <!-- 蓋章原因與操作區 -->
      <div class="stamp-box">
        <input
          id="reasonInput"
          type="text"
          maxlength="30"
          placeholder="這次為什麼獲得乖寶寶章？（例如：準時睡覺、幫忙做家事）"
        />
        <div class="actions">
          <button id="stampBtn" type="button" class="primary">蓋章 +1</button>
          <button id="undoBtn" type="button" class="ghost">撤銷上一筆</button>
          <button id="resetBtn" type="button" class="danger-ghost">清空全部</button>
        </div>
      </div>

      <!-- 獎勵兌換與扣點區 -->
      <div class="section">
        <h2>獎勵兌換與扣點</h2>
        <div id="rewardList" class="reward-list"></div>
      </div>

      <!-- 歷史紀錄區 -->
      <div class="section">
        <div class="section-head">
          <h2>歷史紀錄</h2>
          <div class="io-actions">
            <button id="refreshBtn" type="button" class="mini-btn">重新同步</button>
            <button id="exportBtn" type="button" class="mini-btn">複製存檔</button>
            <button id="importBtn" type="button" class="mini-btn">匯入存檔</button>
          </div>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
