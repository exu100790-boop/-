<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <title>乖寶寶章集點卡</title>

</head>
<body>

    <h1>乖寶寶集點卡</h1>

      <button id="resetBtn" type="button" class="secondary">清空重來</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
