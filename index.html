<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乖宝宝章互动集点卡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="top-bar">
        <h1>乖宝宝集点卡</h1>
        <span class="badge">持有章数：<strong id="count">0</strong> 颗</span>
      </div>
      <p class="subtitle" id="milestoneText">本轮集点进度：0 / 10</p>

      <!-- 10 个印章格子 -->
      <div id="grid" class="grid"></div>

      <!-- 盖章原因与操作区 -->
      <div class="stamp-box">
        <input
          id="reasonInput"
          type="text"
          maxlength="30"
          placeholder="这次为什么获得乖宝宝章？（例如：准时睡觉、帮忙做家事）"
        />
        <div class="actions">
          <button id="stampBtn" type="button" class="primary">盖章 +1</button>
          <button id="undoBtn" type="button" class="ghost">撤销上一笔</button>
          <button id="resetBtn" type="button" class="danger-ghost">清空全部</button>
        </div>
      </div>

      <!-- 奖励兑换区 -->
      <div class="section">
        <h2>奖励兑换区</h2>
        <div id="rewardList" class="reward-list"></div>
      </div>

      <!-- 历史纪录区 -->
      <div class="section">
        <div class="section-head">
          <h2>历史纪录</h2>
          <div class="io-actions">
            <button id="exportBtn" type="button" class="mini-btn">复制存檔</button>
            <button id="importBtn" type="button" class="mini-btn">导入存檔</button>
          </div>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
